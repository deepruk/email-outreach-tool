name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build

  backend:
    name: Backend regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: rohly_test
      APP_URL: https://example.test
      OWNER_EMAIL: test@example.com
      OWNER_PASSWORD: test-password
      OWNER_NAME: Test Owner
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_REDIRECT_URI: https://example.test/api/oauth/gmail/callback
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install fastapi motor python-dotenv "pydantic>=2.6.4" email-validator google-api-python-client google-auth google-auth-oauthlib requests pytest pytest-xdist pytest-asyncio httpx passlib "bcrypt==4.0.1" pyjwt python-multipart
      - name: Run regression tests
        run: pytest -q tests/test_rohly_daily_limits.py tests/test_rohly_open_tracking.py tests/test_rohly_campaign_edit.py tests/test_csv_helpers.py
