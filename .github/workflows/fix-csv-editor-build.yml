name: Fix CSV editor build

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor == 'deepruk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wizard = Path('frontend/src/pages/CsvCampaignWizard.tsx')
          s = wizard.read_text()
          old = 'ArrowLeft, ArrowRight, Check, Clock3, FileSpreadsheet, FlaskConical, Inbox as InboxIcon, Mail, ShieldCheck, Upload'
          new = 'ArrowLeft, ArrowRight, Check, Clock3, FlaskConical, Mail, ShieldCheck, Upload'
          if old not in s:
              raise SystemExit('Wizard import pattern not found')
          wizard.write_text(s.replace(old, new, 1))

          editor = Path('frontend/src/pages/rohly/CampaignEditor.tsx')
          s = editor.read_text()
          old = '  const [timezone, setTimezone] = useState("Asia/Kolkata");\n  const [editingRow, setEditingRow] = useState<number | null>(null);'
          new = '''  const [timezone, setTimezone] = useState("Asia/Kolkata");
  const [minGapMinutes, setMinGapMinutes] = useState(10);
  const [maxGapMinutes, setMaxGapMinutes] = useState(20);
  const [sendingWindowStart, setSendingWindowStart] = useState("09:00");
  const [sendingWindowEnd, setSendingWindowEnd] = useState("18:00");
  const [sendingDays, setSendingDays] = useState<number[]>([0, 1, 2, 3, 4]);
  const [editingRow, setEditingRow] = useState<number | null>(null);'''
          if old not in s:
              raise SystemExit('Editor state pattern not found')
          s = s.replace(old, new, 1)

          old = '    setName(campaign.name); setEmailColumn(campaign.email_column); setFirstNameColumn(campaign.first_name_column || ""); setCompanyColumn(campaign.company_column || ""); setStatusColumn(campaign.status_column || ""); setInboxIds(campaign.inbox_ids); setSteps(campaign.steps); setTimezone(campaign.timezone);'
          new = '    setName(campaign.name); setEmailColumn(campaign.email_column); setFirstNameColumn(campaign.first_name_column || ""); setCompanyColumn(campaign.company_column || ""); setStatusColumn(campaign.status_column || ""); setInboxIds(campaign.inbox_ids); setSteps(campaign.steps); setTimezone(campaign.timezone); setMinGapMinutes(campaign.min_gap_minutes ?? 10); setMaxGapMinutes(campaign.max_gap_minutes ?? 20); setSendingWindowStart(campaign.sending_window_start ?? "09:00"); setSendingWindowEnd(campaign.sending_window_end ?? "18:00"); setSendingDays(campaign.sending_days?.length ? campaign.sending_days : [0, 1, 2, 3, 4]);'
          if old not in s:
              raise SystemExit('Editor effect pattern not found')
          s = s.replace(old, new, 1)

          old = '  const makePayload = (sourceId: string): CsvCampaignCreate => ({ name, source_id: sourceId, email_column: emailColumn, first_name_column: firstNameColumn || null, company_column: companyColumn || null, status_column: statusColumn || null, inbox_ids: inboxIds, steps, timezone });'
          new = '  const makePayload = (sourceId: string): CsvCampaignCreate => ({ name, source_id: sourceId, email_column: emailColumn, first_name_column: firstNameColumn || null, company_column: companyColumn || null, status_column: statusColumn || null, inbox_ids: inboxIds, steps, timezone, min_gap_minutes: minGapMinutes, max_gap_minutes: maxGapMinutes, sending_window_start: sendingWindowStart, sending_window_end: sendingWindowEnd, sending_days: sendingDays });'
          if old not in s:
              raise SystemExit('Editor payload pattern not found')
          editor.write_text(s.replace(old, new, 1))
          PY
      - name: Validate build files
        run: |
          cd frontend
          yarn install --frozen-lockfile
          yarn tsc -b && yarn vite build
      - name: Commit fixes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/CsvCampaignWizard.tsx frontend/src/pages/rohly/CampaignEditor.tsx .github/workflows/fix-csv-editor-build.yml
          git commit -m "Fix CSV campaign editor build" || exit 0
          git rm .github/workflows/fix-csv-editor-build.yml
          git commit -m "Remove temporary build fixer"
          git push
